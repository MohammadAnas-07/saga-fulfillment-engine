spring:
  application:
    name: inventory-service

  datasource:
    # inventory-service owns its own database.
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${INVENTORY_DB_USER:inventory_service}
    password: ${INVENTORY_DB_PASSWORD:inventory_service}

  jpa:
    hibernate:
      # Fine for a portfolio project. A real deployment would use Flyway/Liquibase
      # migrations and set this to `validate`.
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
    consumer:
      group-id: ${INVENTORY_CONSUMER_GROUP:inventory-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${INVENTORY_SERVICE_PORT:8082}

logging:
  level:
    com.mohammadanas.saga.inventory: INFO
