spring:
  application:
    name: order-service

  datasource:
    # order-service owns its own database — no other service reads these tables.
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:order_service}
    password: ${ORDER_DB_PASSWORD:order_service}

  jpa:
    hibernate:
      # Fine for a portfolio project. A real deployment would use Flyway/Liquibase
      # migrations and set this to `validate`.
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # The topic plus the listener's declared type is the contract; type headers
        # would couple consumers to our package names. See KafkaConfig.
        spring.json.add.type.headers: false
      acks: all
    consumer:
      group-id: ${ORDER_CONSUMER_GROUP:order-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${ORDER_SERVICE_PORT:8081}

logging:
  level:
    com.mohammadanas.saga.order: INFO
